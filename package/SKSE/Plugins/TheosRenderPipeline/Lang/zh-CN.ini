"A/B for the post-Present wait, not saved. Off drains every host lane on the CPU; on queues a GPU wait for Intel's input copies. The log reports both waits every 600 frames. With heavy NR, on can make rendered frames alternate long and short." = "Present 后等待方式的 A/B 对比，不保存。关闭时在 CPU 上排空每条宿主通道；开启时改为 GPU 等待 Intel 的输入复制。日志每 600 帧报告两种等待。在 NR 负载较重时，开启可能使渲染帧长短交替。"
"A/B, not saved. Off: the game's next frame waits on the GPU until frame generation has read this frame's inputs. On: it waits only where TRP first writes them, so the world can render meanwhile. Compare FPS and the frame generation time." = "A/B 对比，不保存。关闭：游戏的下一帧在 GPU 上等待，直到帧生成读取完本帧输入。开启：只在 TRP 首次写入这些输入的位置等待，世界可同时渲染。请比较 FPS 与帧生成耗时。"
