[Adapters]
; Adapter settings for the ImGui integration built into TheosRenderPipeline.dll.
; Master switch. Unknown DLL hashes and guarded byte mismatches always fail closed.
EnableAll=1

KreatE=1
ImmersiveEquipmentDisplays=1
OpenAnimationReplacer=1
PhotoMode=1
dMenu=1
SkyrimVanitySystem=1
MaxsuDetectionMeter=1
SpellHotbar2=1

[Diagnostics]
; Exact-version, read-only telemetry for Skyrim Vanity System text focus,
; Scaleform input delivery, ImGui display geometry, and configured font size.
; Leave disabled outside a focused compatibility test.
VanityTextInput=0

; Exact-version, read-only telemetry for SpellHotbar2 0.0.14 ImDrawData,
; including display geometry, vertex bounds, and command clip bounds.
SpellHotbarGeometry=0
