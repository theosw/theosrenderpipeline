; Theo's Render Pipeline. Paths use Skyrim's virtual Data/SKSE/Plugins directory.
; Output resolution and refresh rate come from the game's display configuration.
[Settings]
; Startup: 0=DLSS, 3=DLAA. Quality: 0=Performance, 1=Balanced, 2=Quality, 3=Ultra Performance, 4=Ultra Quality (78%).
UpscaleType=0
QualityLevel=2
UseOptimalMipLodBias=true
MipLodBias=0.0
Sharpening=true
Sharpness=0.672
EnableJitter=true
AutoExposure=true
DLSSPreset=11
NativeUI=true
; Request artwork on eligible cell transitions; Skyrim still selects the image.
RequestLoadingArtwork=true

[Overlay]
; Window layout is remembered only by Save as default. Divider is shared across tabs.
; Saved windows are kept on-screen when the output resolution changes.
WindowX=40
WindowY=40
WindowWidth=1100
WindowHeight=720
LeftColumnFraction=0.5

[Hotkeys]
; End. Keep startup/quality changes for the next game launch.
ToggleOverlay=0x23
; Opt in to [ = NR off and ] = NR on (US layout), including while the menu is closed.
; Session-only shortcuts. The NR menu checkbox works independently. Restart after editing.
EnableNRHotkeys=false

[Compatibility]
; Apply ReShade to world color before (true) or after (false) upscaling.
; ReShade's preset and effect hotkey remain in ReShade.ini.
ReShadeBeforeUpscaling = false
WheelerLateOverlayBridge=true

[Performance]
EnableGPUTimings=true
EnableFrameTrace=false
DirectRCASOutput=false
DirectDLSSOutput=false

[FrameGeneration]
; Initial interpolation request. The NVIDIA host remains required when false.
Enabled=true

[Experimental]
; Runtime locations are relative to Skyrim's virtual Data/SKSE/Plugins directory.
SourceDLSSGStreamlineDirectory=TheosRenderPipeline/NVIDIA/Streamline
; Dedicated native UI composition, required for NR and startup overlays.
NativeUICompositionMode=0
; Separately supplied NR runtime; its initial enabled state is below.
NeuralRenderingRuntimePath=TheosRenderPipeline/NVIDIA/nvngx_dlssnr.dll
; Allow Universal's Ada/Ampere MFG compatibility. The Standard build ignores this.
; Other NVIDIA GPUs use the native runtime.
; False uses native runtime capabilities, without Ada/Ampere compatibility.
SourceDLSSGMFGUnlock=true

[SourceDLSSG]
; Generated frames exclude the real frame: 1 requests x2.
GeneratedFrames=1
DynamicMFG=false
DynamicTargetFPS=0
OutputFPSLimit=0
ReflexMode=1
NeuralRenderingEnabled=false
NRBeforeUpscaling=true
NRPasses=1
# When false, NRPass2InputScale/NRPass2Preset and NRPass2 image tuning override pass 1.
NRPass2UseSameSettings=true
; Experimental spatial NR compression. Off retains the existing uniform path.
NRPeripheralCompression=false
; Combine eligible colour and guide preparation without skipping NR evaluations.
NRFusedPreparation=false
