; Theo's Render Pipeline. Paths use Skyrim's virtual Data/SKSE/Plugins directory.
; Output resolution and refresh rate come from the game's display configuration.
[Appearance]
; Optional weather/time presets for NR and sharpening. Configure them in the Neural Rendering tab.
Enabled=false
SmoothingSeconds=2.0
WeatherCount=0

[Settings]
; Startup: 0=DLSS, 3=DLAA, 4=XeSS (experimental, Intel startup).
; Quality: 0=Performance, 1=Balanced, 2=Quality, 3=Ultra Performance, 4=Ultra Quality. XeSS queries Intel's render sizes.
UpscaleType=0
QualityLevel=2
UseOptimalMipLodBias=true
MipLodBias=0.0
Sharpening=true
Sharpness=0.672
EnableJitter=true
AutoExposure=true
DLSSPreset=11
NativeUI=true
; Request artwork on eligible cell transitions; Skyrim still selects the image.
RequestLoadingArtwork=true

[Overlay]
; Menu zoom: 0=automatic (output height / 1080, at least 1.0), or 0.75-3.0.
UIScale=0
; Window layout is remembered only by Save as default. Divider is shared across tabs.
; Geometry is in 100% units and follows the zoom. Saved windows are kept on-screen.
WindowX=40
WindowY=40
WindowWidth=1100
WindowHeight=720
LeftColumnFraction=0.5

[Hotkeys]
; Win32 virtual key, End by default. Change it in the menu under Advanced > Menu key.
ToggleOverlay=0x23
; Opt in to [ = NR off and ] = NR on (US layout), including while the menu is closed.
; Session-only shortcuts. The NR menu checkbox works independently. Restart after editing.
EnableNRHotkeys=false

[Compatibility]
; Apply ReShade to world color before (true) or after (false) upscaling.
; ReShade's preset and effect hotkey remain in ReShade.ini.
ReShadeBeforeUpscaling = false
WheelerLateOverlayBridge=true

[Performance]
EnableGPUTimings=true
EnableFrameTrace=false
DirectRCASOutput=false
DirectDLSSOutput=false

[FrameGeneration]
; 0=NVIDIA DLSS-G (default), 1=Intel XeFG x2 test. Apply changes provider live.
; XeSS startup uses Intel directly; DLSS/DLAA and NR require NVIDIA RTX hardware.
Provider=0
; Intel XeFG receives the measured frame time for its pacing on non-Intel GPUs. Live toggle.
XeFGFrameTime=true
; Initial interpolation request. The selected presentation host remains required when false.
Enabled=true

[Experimental]
; Runtime locations are relative to Skyrim's virtual Data/SKSE/Plugins directory.
SourceDLSSGStreamlineDirectory=TheosRenderPipeline/NVIDIA/Streamline
; Dedicated native UI composition, required for NR and startup overlays.
NativeUICompositionMode=0
; Separately supplied NR runtime; its initial enabled state is below.
NeuralRenderingRuntimePath=TheosRenderPipeline/NVIDIA/nvngx_dlssnr.dll
; Allow Universal's Ada/Ampere and experimental RTX20 Turing MFG compatibility.
; The Standard build ignores this.
; Other NVIDIA GPUs use the native runtime.
; False uses native runtime capabilities, without compatibility preparation.
SourceDLSSGMFGUnlock=true

[SourceDLSSG]
; Generated frames exclude the real frame: 1 requests x2.
GeneratedFrames=1
DynamicMFG=false
DynamicTargetFPS=0
; DLSS-G interpolates the HUD-less scene and UI separately (small GPU/VRAM cost).
UIRecomposition=true
OutputFPSLimit=0
ReflexMode=1
NeuralRenderingEnabled=false
NRBeforeUpscaling=true
NRPasses=1
# Optional temporary reduction from two passes to one; saved pass settings are retained.
NROnePassInCombat=false
NROnePassWeaponsDrawn=false
# Seconds after both selected conditions clear; paused gameplay does not count (0-30).
NRPassRecoverySeconds=5
# When false, NRPass2InputScale/NRPass2Preset and NRPass2 image tuning override pass 1.
NRPass2UseSameSettings=true
; Experimental spatial NR compression. Off retains the existing uniform path.
NRPeripheralCompression=false
; Combine eligible colour and guide preparation without skipping NR evaluations.
NRFusedPreparation=false

[HDROutput]
; Experimental HDR10 output for ENB and other non-Community Shaders setups.
; Expands the finished SDR image; clipped highlights cannot be recovered.
; Enabled needs Windows HDR; the menu switches it without a restart. With CS, use CS HDR Display instead.
Enabled=false
; Use Windows' SDR content brightness for paper white and UI (false uses the values below).
MatchWindowsSDRBrightness=true
PaperWhiteNits=200
PeakNits=1000
UIBrightnessNits=200
; 0 keeps the SDR range at paper white; 1 expands the brightest pixels to peak.
HighlightStrength=1
; Linear SDR brightness where expansion begins (0.1-0.95).
ExpansionStart=0.7
; SDR decoding: 0 = gamma 2.2, 1 = sRGB.
SDRTransfer=0
